name: CI
on:
  pull_request:
  push:
    branches: [main]
# A newer push to the same branch or pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
        timeout-minutes: 5
      # The steps of `npm run verify`, in its order, one step each. Each runs
      # even when an earlier one failed, so one failure never hides another.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check
        timeout-minutes: 5
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
        timeout-minutes: 5
      - name: Dead code and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run knip
        timeout-minutes: 5
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
        timeout-minutes: 5
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
        timeout-minutes: 5
      - id: playwright
        name: Playwright version
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        timeout-minutes: 1
      - name: Restore Playwright Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads only what the cache lacks; system libraries are always needed.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Browser tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e
        timeout-minutes: 10
      - name: Keep browser test results
        if: ${{ failure() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for repositories owned by an organisation; free from gitleaks.io.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false
